<svg xmlns="http://www.w3.org/2000/svg" width="980" height="404" viewBox="0 0 980 404"><rect width="980" height="404" fill="#12141c"/><rect width="980" height="56" fill="#1c2029"/><text x="32" y="40" font-size="26" fill="#e8ecf4" font-weight="bold">Proof-of-Policy — end-to-end demo</text><text x="32" y="78" font-size="16" fill="#96a0b2">certificates: 14  stream: 4  blocked: ['args']</text><text x="32" y="128" font-size="16" fill="#34c77b">PASS  ledger_chain  ok</text><text x="32" y="156" font-size="16" fill="#34c77b">PASS  certificates_signature  14 certs, 1 key(s) in ring</text><text x="32" y="184" font-size="16" fill="#34c77b">PASS  certificates_policy_hash  2 pack(s), 3 sources</text><text x="32" y="212" font-size="16" fill="#34c77b">PASS  certificates_response_binding  3 challenge-bound cert(s), self-consistent</text><text x="32" y="240" font-size="16" fill="#34c77b">PASS  certificates_proof_mode  14 cert(s) labeled, 0 predate the field</text><text x="32" y="268" font-size="16" fill="#34c77b">PASS  certificates_anchored  digest present in ledger</text><text x="32" y="296" font-size="16" fill="#34c77b">PASS  stream_chains  2 run(s)</text><text x="32" y="324" font-size="16" fill="#34c77b">PASS  zk_proof  unproven (host-check only)×3</text><text x="32" y="352" font-size="16" fill="#34c77b">PASS  chain_anchored  not anchored on chain (file ledger only)</text></svg>