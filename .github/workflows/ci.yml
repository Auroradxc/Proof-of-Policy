name: ci

# Fast, offline-friendly checks: the Python reference layer, the zkVM host-side
# judging (pop-script --check), and the verifier-only plumbing. Real SP1 proofs
# (and the compressed audit fixture) need a large runner: see docs/plan-p7.md.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Python test suite (Rust binaries absent → those cases skip)
        run: python3 -m unittest discover tests -v
      - name: On-chain anchoring tests (offline fake-RPC; anvil e2e auto-skips without foundry)
        run: python3 -m unittest tests.test_anchor tests.test_anchor_chain -v
      - name: Docs sanity (no absolute machine paths)
        run: "! grep -rn '/home/[a-z]*/方向二' --include='*.md' . || (echo 'stale absolute path'; exit 1)"
