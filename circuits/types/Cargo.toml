[package]
name = "pop-types"
version = "0.1.0"
edition = "2021"
description = "Shared types for Proof-of-Policy: the ProofRequest consumed by the SP1 program and the ProofOutput it commits"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10", default-features = false }

[dev-dependencies]
# C2：公开值用 bincode 编解码（SP1 `io::commit`）。测试必须走同一条路，
# 否则 tagged enum 之类只在 bincode 下暴露的问题会漏到出证阶段。
bincode = "1.3"
