[package]
name = "pop-verify"
version = "0.1.0"
edition = "2021"
description = "Verifier-only binary for Proof-of-Policy: verifies compressed/groth16/plonk proofs via sp1-verifier (no prover)"

[dependencies]
sp1-verifier = "6.7.0"
# 解码公开值（`Outcome`）并与 pop-script 共用同一份摊平实现 —— 见 main.rs 中
# 「解码公开值」一节：只比对公开值的哈希会让证书里的 policy_hash 悬空。
pop-types = { path = "../types" }
bincode = "1.3"
serde_json = "1"
sha2 = "0.10"
